    /* Repo Galaxy CSS Animations — Camo-safe pure CSS keyframes (inlined into SVG assets) */

.gx-title {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  letter-spacing: 1.6px;
}

.gx-mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
}

@keyframes gxStarTwinkle {
  0%, 100% {
    opacity: 0.25;
  }
  50% {
    opacity: 0.95;
  }
}

@keyframes gxCorePulse {
  0%, 100% {
    transform: scale(0.95);
    opacity: 0.72;
  }
  50% {
    transform: scale(1.08);
    opacity: 1;
  }
}

@keyframes gxCoreSpin {
  0% {
    transform: rotate(0deg);
  }
  100% {
    transform: rotate(360deg);
  }
}

@keyframes gxCoreSpinReverse {
  0% {
    transform: rotate(360deg);
  }
  100% {
    transform: rotate(0deg);
  }
}

@keyframes gxNodeGlow {
  0%, 100% {
    opacity: 0.22;
  }
  50% {
    opacity: 0.52;
  }
}

.gx-star-a {
  animation: gxStarTwinkle 3.4s ease-in-out infinite;
}

.gx-star-b {
  animation: gxStarTwinkle 4.9s ease-in-out 1.4s infinite;
}

.gx-star-c {
  animation: gxStarTwinkle 6.2s ease-in-out 2.3s infinite;
}

.gx-core-pulse {
  transform-origin: 0px 0px;
  animation: gxCorePulse 5.5s ease-in-out infinite;
}

.gx-spiral-spin {
  transform-origin: 0px 0px;
  animation: gxCoreSpin 96s linear infinite;
}

.gx-ring-spin {
  transform-origin: 0px 0px;
  animation: gxCoreSpinReverse 52s linear infinite;
}

.gx-particles-spin {
  transform-origin: 0px 0px;
  animation: gxCoreSpin 68s linear infinite;
}

.gx-node-halo {
  animation: gxNodeGlow 3.6s ease-in-out infinite;
}

.gx-repo-link {
  cursor: pointer;
  pointer-events: all;
  text-decoration: none;
}

.gx-repo-link .gx-node-dot,
.gx-repo-link .gx-label-pill,
.gx-repo-link .gx-label-text {
  transition: opacity 0.16s ease, stroke 0.16s ease, stroke-width 0.16s ease, fill 0.16s ease;
}

.gx-repo-link:hover .gx-node-halo,
.gx-repo-link:focus .gx-node-halo {
  opacity: 0.85;
}

.gx-repo-link:hover .gx-node-dot,
.gx-repo-link:focus .gx-node-dot {
  stroke: #ffffff;
  stroke-opacity: 0.95;
  stroke-width: 1.4;
}

.gx-repo-link:hover .gx-label-pill,
.gx-repo-link:focus .gx-label-pill {
  fill: #101b38;
  stroke: #5aa9ff;
  stroke-width: 1.1;
}

.gx-repo-link:hover .gx-label-text,
.gx-repo-link:focus .gx-label-text {
  fill: #ffffff;
}

.gx-orbit-0 {
  transform-origin: 0px 0px;
  animation: gxCoreSpin 42s linear infinite;
}
.gx-counter-0 {
  transform-origin: 0px 0px;
  animation: gxCoreSpinReverse 42s linear infinite;
}

.gx-orbit-1 {
  transform-origin: 0px 0px;

}
.gx-counter-1 {
  transform-origin: 0px 0px;

}

.gx-orbit-2 {

.gx-counter-2 {

.gx-orbit-3 {

.gx-counter-3 {

.gx-orbit-4 {
